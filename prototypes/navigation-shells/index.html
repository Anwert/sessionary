<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sessionary navigation-shell prototype</title>
  <style>
    /* THROWAWAY PROTOTYPE: three finalists, switchable with ?variant=overview|drawer|workspace. */
    :root { color-scheme: dark; --bg:#0c1015; --panel:#141b23; --line:#293442; --muted:#8794a3; --text:#e8edf2; --accent:#75d5b2; --warn:#ffca68; --dim:#1b242e; }
    * { box-sizing: border-box; }
    body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace; }
    button { font:inherit; color:inherit; }
    .app { height:100vh; display:grid; }
    .terminal { min-width:0; background:#090d11; padding:22px 28px 72px; overflow:auto; }
    .term-head { color:var(--muted); margin-bottom:22px; }
    .prompt { color:var(--accent); }
    .agent { max-width:820px; white-space:pre-wrap; }
    .cursor { display:inline-block; width:8px; height:15px; background:var(--text); vertical-align:-2px; animation:blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .panel { background:var(--panel); border-color:var(--line); }
    .brand { position:sticky; top:0; z-index:2; padding:14px 16px; background:var(--panel); color:var(--accent); font-weight:700; border-bottom:1px solid var(--line); }
    .section-title { padding:15px 14px 7px; color:var(--muted); font-size:11px; letter-spacing:.09em; text-transform:uppercase; }
    .session { width:100%; border:0; border-left:3px solid transparent; background:transparent; text-align:left; padding:9px 12px; cursor:pointer; display:grid; grid-template-columns:12px 1fr auto; gap:8px; align-items:start; }
    .session:hover,.session.selected { background:var(--dim); border-left-color:var(--accent); }
    .dot { width:8px; height:8px; border-radius:50%; margin-top:4px; background:#6e7c8b; }
    .dot.input { background:var(--warn); box-shadow:0 0 8px #ffca6866; }
    .dot.working { background:var(--accent); }
    .dot.finished { background:#75879a; }
    .meta { color:var(--muted); font-size:11px; margin-top:2px; }
    .context { color:var(--muted); font-size:11px; }
    .notice { color:var(--warn); }
    .hint { position:fixed; top:10px; right:12px; color:var(--muted); background:#0c1015dd; border:1px solid var(--line); border-radius:5px; padding:6px 9px; z-index:20; }
    .switcher { position:fixed; z-index:50; bottom:14px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px; padding:7px 9px; border:1px solid #627185; border-radius:999px; background:#e9eef4; color:#10151b; box-shadow:0 8px 30px #000a; }
    .switcher button { width:30px; height:26px; border:0; border-radius:99px; background:#cbd5df; cursor:pointer; }
    .switcher span { min-width:240px; text-align:center; font-weight:700; }
    .overlay { position:fixed; inset:0 0 58px; z-index:15; background:#080c10f2; display:grid; place-items:center; }
    .overview { width:min(1180px,94vw); height:calc(100vh - 100px); overflow:auto; padding:0 6px 36px; }
    .overview h1 { font-size:20px; }
    .overview-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .filters,.actions { display:flex; gap:7px; }
    .chip { border:1px solid var(--line); background:var(--panel); padding:5px 8px; cursor:pointer; }
    .chip.active { color:#10151b; background:var(--accent); }
    .group-block { margin:0 0 22px; }
    .group-head { position:sticky; top:0; z-index:1; display:flex; justify-content:space-between; padding:9px 3px; background:#080c10f2; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
    .card { padding:14px; border:1px solid var(--line); background:var(--panel); cursor:pointer; min-height:110px; }
    .card.selected { outline:2px solid var(--accent); }
    .drawer { position:fixed; z-index:14; top:0; right:0; bottom:58px; width:min(520px,52vw); border-left:1px solid var(--line); box-shadow:-20px 0 50px #0008; overflow:auto; }
    .drawer .session { padding:14px; }
    .drawer-detail { margin:12px; padding:14px; border:1px solid var(--line); background:#0c1219; }
    .drawer-detail h2 { margin:0 0 4px; font-size:15px; }
    .progress { height:5px; margin:10px 0; background:#26313d; }
    .progress i { display:block; height:100%; background:var(--accent); }
    .keyline { margin-top:14px; color:var(--muted); font-size:11px; }
    .workspace { height:calc(100vh - 58px); display:grid; grid-template-columns:minmax(620px,1fr) 360px; background:var(--bg); }
    .workspace-list { overflow:auto; padding:18px 22px 60px; }
    .workspace-toolbar { position:sticky; top:-18px; z-index:4; display:flex; gap:10px; align-items:center; padding:14px 0; background:var(--bg); }
    .workspace-toolbar h1 { margin:0 auto 0 0; font-size:18px; }
    .search { width:230px; border:1px solid var(--line); background:var(--panel); color:var(--text); padding:7px 9px; font:inherit; }
    .table { width:100%; border-collapse:collapse; }
    .table th { color:var(--muted); font-size:11px; text-align:left; text-transform:uppercase; padding:7px; }
    .table td { padding:8px 7px; border-top:1px solid var(--line); }
    .table tr[data-preview] { cursor:pointer; }
    .table tr[data-preview]:hover,.table tr.selected { background:var(--dim); }
    .workspace-detail { border-left:1px solid var(--line); background:var(--panel); padding:24px 20px; overflow:auto; }
    .workspace-detail h2 { margin:5px 0; }
    kbd { border:1px solid #657285; border-bottom-width:2px; border-radius:3px; padding:1px 5px; background:#202a35; }
    .toast { position:fixed; z-index:30; top:48px; left:50%; transform:translateX(-50%); padding:8px 12px; background:#332b19; color:var(--warn); border:1px solid #685a35; }
    @media (max-width:900px) { .grid { grid-template-columns:repeat(2,1fr); } .drawer { width:85vw; } .workspace { grid-template-columns:1fr; } .workspace-detail { display:none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const variants = [
      ['overview','A','Fullscreen overlay'], ['drawer','B','Transient drawer'], ['workspace','C','Dedicated workspace']
    ];
    const sessions = [
      {id:'auth', key:'a', name:'Fix OAuth callback', group:'Release 2.4', state:'working', harness:'Claude Code', context:68, repo:'web-api', branch:'fix/oauth-callback', age:'18m', detail:'Refactoring callback validation and running integration tests.'},
      {id:'billing', key:'b', name:'Investigate billing retry', group:'Release 2.4', state:'input', harness:'Codex', context:41, repo:'billing', branch:'investigate/retries', age:'7m', detail:'I need your choice: retry failed invoices immediately, or preserve the current nightly batch?'},
      {id:'changelog', name:'Draft release changelog', group:'Release 2.4', state:'finished', harness:'Claude Code', context:82, repo:'web-api', branch:'release/2.4', age:'52m', detail:'Changelog draft is ready for review.'},
      {id:'migration', name:'Verify schema migration', group:'Release 2.4', state:'working', harness:'Codex', context:56, repo:'billing', branch:'release/schema-v12', age:'24m', detail:'Checking rollback behavior against the staging snapshot.'},
      {id:'docs', name:'Refresh onboarding docs', group:'Website refresh', state:'finished', harness:'Claude Code', context:87, repo:'website', branch:'docs/onboarding', age:'1h', detail:'Onboarding rewrite is complete. Ready to review or resume.'},
      {id:'perf', name:'Trace startup regression', group:'Website refresh', state:'input', harness:'Claude Code', context:76, repo:'website', branch:'perf/startup', age:'32m', detail:'Which baseline should I use: last release or the pre-router commit?'},
      {id:'hero', name:'Polish homepage hero', group:'Website refresh', state:'working', harness:'Codex', context:35, repo:'website', branch:'design/hero', age:'11m', detail:'Applying the selected typography scale to the hero.'},
      {id:'redirects', name:'Audit legacy redirects', group:'Website refresh', state:'working', harness:'Claude Code', context:49, repo:'website', branch:'seo/redirect-audit', age:'43m', detail:'Scanning production paths for redirect chains.'},
      {id:'invoices', name:'Reconcile duplicate invoices', group:'Billing incidents', state:'input', harness:'Codex', context:63, repo:'billing', branch:'incident/duplicate-invoices', age:'14m', detail:'I found two possible sources and need a production query approved.'},
      {id:'webhook', name:'Replay failed webhooks', group:'Billing incidents', state:'working', harness:'Claude Code', context:72, repo:'billing', branch:'incident/webhooks', age:'39m', detail:'Preparing a dry-run replay manifest.'},
      {id:'tax', name:'Check tax rounding drift', group:'Billing incidents', state:'working', harness:'Codex', context:28, repo:'ledger', branch:'investigate/tax-rounding', age:'9m', detail:'Comparing line-item and invoice-level rounding.'},
      {id:'timeline', name:'Write incident timeline', group:'Billing incidents', state:'finished', harness:'Claude Code', context:91, repo:'ops', branch:'postmortem/billing', age:'2h', detail:'Timeline is complete and awaits review.'},
      {id:'search', name:'Prototype fuzzy search', group:'Sessionary MVP', state:'working', harness:'Codex', context:23, repo:'sessionary', branch:'prototype/search', age:'4m', detail:'Comparing scoring behavior on short session names.'},
      {id:'tmux', name:'Spike tmux attachment', group:'Sessionary MVP', state:'input', harness:'Claude Code', context:59, repo:'sessionary', branch:'spike/tmux', age:'27m', detail:'Should detached sessions retain the original window title?'},
      {id:'states', name:'Model session states', group:'Sessionary MVP', state:'working', harness:'Codex', context:44, repo:'sessionary', branch:'model/session-state', age:'16m', detail:'Checking state transitions against the current UX notes.'},
      {id:'fixtures', name:'Expand fake session fixtures', group:'Sessionary MVP', state:'finished', harness:'Claude Code', context:31, repo:'sessionary', branch:'prototype/fixtures', age:'48m', detail:'Added high-density and mixed-state fixture sets.'},
      {id:'sdk', name:'Evaluate analytics SDK', group:'Analytics rollout', state:'input', harness:'Codex', context:67, repo:'web-app', branch:'spike/analytics-sdk', age:'21m', detail:'Do we prioritize bundle size or server-side feature coverage?'},
      {id:'events', name:'Define product events', group:'Analytics rollout', state:'working', harness:'Claude Code', context:38, repo:'web-app', branch:'analytics/event-schema', age:'33m', detail:'Mapping the signup funnel to stable event names.'},
      {id:'dashboard', name:'Validate KPI dashboard', group:'Analytics rollout', state:'finished', harness:'Codex', context:79, repo:'analytics', branch:'dashboard/kpi-review', age:'1h', detail:'The KPI dashboard matches the sample warehouse data.'},
      {id:'consent', name:'Review consent behavior', group:'Analytics rollout', state:'working', harness:'Claude Code', context:52, repo:'web-app', branch:'privacy/consent', age:'12m', detail:'Tracing events before and after consent changes.'},
      {id:'flake', name:'Triage checkout test flakes', group:'Maintenance', state:'input', harness:'Codex', context:33, repo:'web-app', branch:'test/checkout-flakes', age:'6m', detail:'Should I quarantine the three timing-sensitive cases first?'},
      {id:'deps', name:'Update terminal dependencies', group:'Maintenance', state:'working', harness:'Claude Code', context:47, repo:'sessionary', branch:'chore/dependencies', age:'19m', detail:'Reviewing changelogs for terminal rendering regressions.'},
      {id:'logs', name:'Reduce noisy API logs', group:'Maintenance', state:'working', harness:'Codex', context:61, repo:'web-api', branch:'chore/log-volume', age:'36m', detail:'Sampling repeated health-check and retry messages.'},
      {id:'secrets', name:'Rotate staging secrets', group:'Maintenance', state:'finished', harness:'Claude Code', context:18, repo:'ops', branch:'ops/secret-rotation', age:'3h', detail:'Rotation completed and old credentials revoked.'}
    ];
    let state = { selected:'auth', previous:null, overlay:false, toast:'', filter:'all', query:'', inHarness:false };
    const params = new URLSearchParams(location.search);
    let variant = variants.some(v => v[0] === params.get('variant')) ? params.get('variant') : 'overview';
    const current = () => sessions.find(s => s.id === state.selected);
    const stateLabel = s => s.state === 'input' ? 'Needs input' : s.state[0].toUpperCase()+s.state.slice(1);
    const sessionRow = s => `<button class="session ${s.id===state.selected?'selected':''}" data-session="${s.id}"><i class="dot ${s.state}"></i><span>${s.name}<div class="meta">${s.harness} · ${stateLabel(s)}</div></span><span class="context">${s.context}%</span></button>`;
    const previewRow = s => `<button class="session ${s.id===state.selected?'selected':''}" data-preview="${s.id}"><i class="dot ${s.state}"></i><span>${s.name}<div class="meta">${s.harness} · ${stateLabel(s)}</div></span><span class="context">${s.context}%</span></button>`;
    const terminal = (s=current()) => `<main class="terminal"><div class="term-head">${s.group} / ${s.name} · ${s.harness} · context ${s.context}%</div><div class="agent"><span class="prompt">assistant ›</span> ${s.detail}\n\n<span class="prompt">you ›</span> <span class="cursor"></span></div></main>`;
    const groups = [...new Set(sessions.map(s=>s.group))];
    function shell() {
      if (variant === 'overview') return `<div class="app">${terminal()}${state.overlay?overview():''}</div><div class="hint"><kbd>Space</kbd> overview · <kbd>t</kbd> attention filter · <kbd>f</kbd> finish · <kbd>Enter</kbd> focus</div>`;
      if (variant === 'drawer') return `<div class="app">${terminal()}${state.overlay?drawer():''}</div><div class="hint"><kbd>Ctrl+k</kbd> drawer · <kbd>j/k</kbd> inspect · <kbd>f</kbd> finish · <kbd>Enter</kbd> focus</div>`;
      if (variant === 'workspace') return state.inHarness ? `<div class="app">${terminal()}</div><div class="hint"><kbd>Esc</kbd> return to Session workspace · <kbd>r</kbd> previous Session</div>` : workspace();
    }
    function overview() { const visible=state.filter==='input'?sessions.filter(s=>s.state==='input'):sessions; const blocks=groups.map(g=>{const items=visible.filter(s=>s.group===g); return items.length?`<section class="group-block"><div class="group-head"><strong>${g}</strong><span>${items.length} Session${items.length===1?'':'s'}</span></div><div class="grid">${items.map(s=>`<article class="card ${s.id===state.selected?'selected':''}" data-preview="${s.id}"><i class="dot ${s.state}" style="display:inline-block"></i> <strong>${s.name}</strong><div class="meta">${s.harness} · ${s.age}</div><p>${stateLabel(s)}</p><div class="meta">${s.repo} · ${s.branch}</div><div class="progress"><i style="width:${s.context}%"></i></div><span class="context">context ${s.context}%</span></article>`).join('')}</div></section>`:''}).join(''); return `<div class="overlay"><section class="overview"><div class="overview-head"><h1>${sessions.length} sessions across ${groups.length} Groups <span class="notice">· ${sessions.filter(s=>s.state==='input').length} need input</span></h1><div class="filters"><button class="chip ${state.filter==='all'?'active':''}" data-filter="all">1 All</button><button class="chip ${state.filter==='input'?'active':''}" data-filter="input">2 Needs input</button></div></div>${blocks}<div class="keyline"><kbd>j/k</kbd> inspect · <kbd>Enter</kbd> focus · <kbd>f</kbd> finish/resume · <kbd>r</kbd> return</div></section></div>`; }
    function drawer() { const s=current(); return `<aside class="drawer panel"><div class="brand">${sessions.length} SESSIONS · ${groups.length} GROUPS <span class="notice">· ${sessions.filter(s=>s.state==='input').length} need input</span></div>${groups.map(g=>`<div class="section-title">${g} · ${sessions.filter(s=>s.group===g).length}</div>${sessions.filter(s=>s.group===g).map(previewRow).join('')}`).join('')}<section class="drawer-detail"><h2>${s.name}</h2><div class="meta">${s.repo} · ${s.branch} · active ${s.age}</div><div class="progress"><i style="width:${s.context}%"></i></div><p>${s.detail}</p><div class="actions"><button class="chip" id="focusSession">Enter focus</button><button class="chip" id="toggleFinished">${s.state==='finished'?'Resume':'Mark finished'}</button></div></section></aside>`; }
    function workspace() { const s=current(); const q=state.query.toLowerCase(); const visible=sessions.filter(x=>!q||`${x.name} ${x.group} ${x.repo} ${x.branch}`.toLowerCase().includes(q)); return `<div class="workspace"><main class="workspace-list"><div class="workspace-toolbar"><h1>Session workspace</h1><button class="chip ${state.filter==='all'?'active':''}" data-filter="all">All ${sessions.length}</button><button class="chip ${state.filter==='input'?'active':''}" data-filter="input">Needs input ${sessions.filter(x=>x.state==='input').length}</button><input class="search" id="sessionSearch" value="${state.query}" placeholder="Search sessions…"></div>${groups.map(g=>{const rows=visible.filter(x=>x.group===g&&(state.filter==='all'||x.state==='input'));return rows.length?`<section class="group-block"><div class="group-head"><strong>${g}</strong><span>${rows.length}</span></div><table class="table"><thead><tr><th>Session</th><th>State</th><th>Harness</th><th>Context</th><th>Active</th></tr></thead><tbody>${rows.map(x=>`<tr class="${x.id===state.selected?'selected':''}" data-preview="${x.id}"><td><strong>${x.name}</strong><div class="meta">${x.repo} · ${x.branch}</div></td><td><i class="dot ${x.state}" style="display:inline-block"></i> ${stateLabel(x)}</td><td>${x.harness}</td><td>${x.context}%</td><td>${x.age}</td></tr>`).join('')}</tbody></table></section>`:''}).join('')}</main><aside class="workspace-detail"><div class="meta">${s.group}</div><h2>${s.name}</h2><p><i class="dot ${s.state}" style="display:inline-block"></i> ${stateLabel(s)} · ${s.harness}</p><div class="meta">${s.repo}<br>${s.branch}<br>active ${s.age}</div><div class="progress"><i style="width:${s.context}%"></i></div><p>Context ${s.context}%</p><p>${s.detail}</p><div class="actions"><button class="chip" id="focusSession">Open native harness</button><button class="chip" id="toggleFinished">${s.state==='finished'?'Resume':'Mark finished'}</button></div><div class="keyline"><kbd>j/k</kbd> inspect · <kbd>Enter</kbd> open harness</div></aside></div>`; }
    function switcher() { const i=variants.findIndex(v=>v[0]===variant), v=variants[i]; return `<nav class="switcher"><button id="prev" aria-label="Previous variant">←</button><span>${v[1]} · ${v[2]} (${i+1}/3)</span><button id="next" aria-label="Next variant">→</button></nav>`; }
    function render() {
      document.getElementById('root').innerHTML = shell() + (state.toast?`<div class="toast">${state.toast}</div>`:'') + switcher();
      document.querySelectorAll('[data-session]').forEach(el => el.onclick=()=>select(el.dataset.session));
      document.querySelectorAll('[data-preview]').forEach(el => el.onclick=()=>preview(el.dataset.preview));
      document.querySelectorAll('[data-filter]').forEach(el => el.onclick=()=>{ state.filter=el.dataset.filter; render(); });
      document.getElementById('prev').onclick=()=>cycle(-1); document.getElementById('next').onclick=()=>cycle(1);
      document.getElementById('focusSession')?.addEventListener('click', ()=>select(state.selected));
      document.getElementById('toggleFinished')?.addEventListener('click', toggleFinished);
      document.getElementById('sessionSearch')?.addEventListener('input', e=>{ state.query=e.target.value; render(); document.getElementById('sessionSearch')?.focus(); });
    }
    function select(id) { if(id!==state.selected) state.previous=state.selected; state.selected=id; state.overlay=false; state.inHarness=variant==='workspace'; state.toast=`Focused ${current().name}`; render(); }
    function preview(id) { state.selected=id; render(); }
    function move(delta) { let i=sessions.findIndex(s=>s.id===state.selected); state.selected=sessions[(i+delta+sessions.length)%sessions.length].id; render(); }
    function toggleFinished() { const s=current(); s.state=s.state==='finished'?'working':'finished'; state.toast=`${s.name}: ${stateLabel(s)}`; render(); }
    function cycle(delta) { let i=variants.findIndex(v=>v[0]===variant); variant=variants[(i+delta+variants.length)%variants.length][0]; const u=new URL(location); u.searchParams.set('variant',variant); history.replaceState({},'',u); state.overlay=false; state.inHarness=false; state.toast=''; render(); }
    addEventListener('keydown', e => {
      if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable) return;
      if(e.key==='ArrowLeft') cycle(-1); if(e.key==='ArrowRight') cycle(1);
      if(e.key==='r'&&state.previous) select(state.previous);
      if(variant==='overview' && e.code==='Space') { e.preventDefault(); state.overlay=!state.overlay; render(); }
      if(variant==='overview' && state.overlay && ['j','k'].includes(e.key)) move(e.key==='j'?1:-1);
      if(variant==='overview' && state.overlay && e.key==='t') { state.filter=state.filter==='all'?'input':'all'; render(); }
      if(variant==='drawer' && e.ctrlKey && e.key==='k') { e.preventDefault(); state.overlay=!state.overlay; render(); }
      if(variant==='drawer' && state.overlay && ['j','k'].includes(e.key)) move(e.key==='j'?1:-1);
      if(state.overlay && e.key==='f') toggleFinished();
      if(variant==='workspace' && !state.inHarness && ['j','k'].includes(e.key)) move(e.key==='j'?1:-1);
      if(variant==='workspace' && state.inHarness && e.key==='Escape') { state.inHarness=false; state.toast=''; render(); }
      if(e.key==='Enter' && state.overlay) select(state.selected);
      if(e.key==='Enter' && variant==='workspace' && !state.inHarness) select(state.selected);
    });
    render();
  </script>
</body>
</html>
