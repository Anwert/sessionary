<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sessionary navigation-shell prototype</title>
  <style>
    /* THROWAWAY PROTOTYPE: the selected nearly fullscreen Session overlay. */
    :root { color-scheme: dark; --bg:#0c1015; --panel:#141b23; --line:#293442; --muted:#8794a3; --text:#e8edf2; --accent:#75d5b2; --warn:#ffca68; --dim:#1b242e; }
    * { box-sizing: border-box; }
    body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace; }
    button { font:inherit; color:inherit; }
    .app { height:100vh; display:grid; }
    .terminal { min-width:0; background:#090d11; padding:22px 28px 72px; overflow:auto; }
    .term-head { color:var(--muted); margin-bottom:22px; }
    .prompt { color:var(--accent); }
    .agent { max-width:820px; white-space:pre-wrap; }
    .cursor { display:inline-block; width:8px; height:15px; background:var(--text); vertical-align:-2px; animation:blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .panel { background:var(--panel); border-color:var(--line); }
    .brand { position:sticky; top:0; z-index:2; padding:14px 16px; background:var(--panel); color:var(--accent); font-weight:700; border-bottom:1px solid var(--line); }
    .section-title { padding:15px 14px 7px; color:var(--muted); font-size:11px; letter-spacing:.09em; text-transform:uppercase; }
    .session { width:100%; border:0; border-left:3px solid transparent; background:transparent; text-align:left; padding:9px 12px; cursor:pointer; display:grid; grid-template-columns:12px 1fr auto; gap:8px; align-items:start; }
    .session:hover,.session.selected { background:var(--dim); border-left-color:var(--accent); }
    .dot { width:8px; height:8px; border-radius:50%; margin-top:4px; background:#6e7c8b; }
    .dot.input { background:var(--warn); box-shadow:0 0 8px #ffca6866; }
    .dot.working { background:var(--accent); }
    .dot.idle { background:#76a9dc; }
    .dot.finished { background:#75879a; }
    .meta { color:var(--muted); font-size:11px; margin-top:2px; }
    .context { color:var(--muted); font-size:11px; }
    .notice { color:var(--warn); }
    .hint { position:fixed; top:10px; right:12px; max-width:min(720px,70vw); color:var(--muted); background:#0c1015ee; border:1px solid var(--line); border-radius:5px; padding:8px 10px; z-index:20; box-shadow:0 8px 24px #0008; }
    .overlay { position:fixed; inset:0 0 58px; z-index:15; background:#080c10f2; display:grid; place-items:center; }
    .overview { width:min(1180px,94vw); height:calc(100vh - 100px); overflow:auto; padding:0 6px 36px; }
    .overview h1 { font-size:20px; }
    .overview-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .board-track { padding: max(0px, calc(50vh - 120px)) 0; }
    .filters,.actions { display:flex; gap:7px; }
    .chip { border:1px solid var(--line); background:var(--panel); padding:5px 8px; cursor:pointer; }
    .chip.active { color:#10151b; background:var(--accent); }
    .group-block { margin:0 0 22px; }
    .group-block.moving-group { outline:2px solid var(--accent); background:#75d5b20a; }
    .group-head { position:sticky; top:0; z-index:1; width:100%; border:0; display:flex; justify-content:space-between; padding:9px 3px; background:#080c10f2; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; text-align:left; cursor:pointer; }
    .group-head.selected-group { color:var(--accent); box-shadow:inset 0 -2px var(--accent); }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
    .card { padding:14px; border:1px solid var(--line); background:var(--panel); cursor:pointer; min-height:110px; }
    .card.selected { outline:2px solid var(--accent); }
    .progress { height:5px; margin:10px 0; background:#26313d; }
    .progress i { display:block; height:100%; background:var(--accent); }
    .keyline { margin-top:14px; color:var(--muted); font-size:11px; }
    .workspace { height:calc(100vh - 58px); display:grid; grid-template-columns:minmax(620px,1fr) 360px; background:var(--bg); }
    .workspace-list { overflow:auto; padding:18px 22px 60px; }
    .workspace-toolbar { position:sticky; top:-18px; z-index:4; display:flex; gap:10px; align-items:center; padding:14px 0; background:var(--bg); }
    .workspace-toolbar h1 { margin:0 auto 0 0; font-size:18px; }
    .search { width:230px; border:1px solid var(--line); background:var(--panel); color:var(--text); padding:7px 9px; font:inherit; }
    .table { width:100%; border-collapse:collapse; }
    .table th { color:var(--muted); font-size:11px; text-align:left; text-transform:uppercase; padding:7px; }
    .table td { padding:8px 7px; border-top:1px solid var(--line); }
    .table tr[data-preview] { cursor:pointer; }
    .table tr[data-preview]:hover,.table tr.selected { background:var(--dim); }
    .workspace-detail { border-left:1px solid var(--line); background:var(--panel); padding:24px 20px; overflow:auto; }
    .workspace-detail h2 { margin:5px 0; }
    kbd { border:1px solid #657285; border-bottom-width:2px; border-radius:3px; padding:1px 5px; background:#202a35; }
    .toast { position:fixed; z-index:30; top:48px; left:50%; transform:translateX(-50%); padding:8px 12px; background:#332b19; color:var(--warn); border:1px solid #685a35; }
    @media (max-width:900px) { .grid { grid-template-columns:repeat(2,1fr); } .workspace { grid-template-columns:1fr; } .workspace-detail { display:none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const sessions = [

      {id:'billing', key:'b', name:'Investigate billing retry', group:'Release 2.4', state:'idle', attention:true, harness:'Codex', context:41, repo:'billing', branch:'investigate/retries', age:'7m', detail:'I need your choice: retry failed invoices immediately, or preserve the current nightly batch?'},
      {id:'changelog', name:'Draft release changelog', group:'Release 2.4', state:'finished', harness:'Claude Code', context:82, repo:'web-api', branch:'release/2.4', age:'52m', detail:'Changelog draft is ready for review.'},
      {id:'migration', name:'Verify schema migration', group:'Release 2.4', state:'working', harness:'Codex', context:56, repo:'billing', branch:'release/schema-v12', age:'24m', detail:'Checking rollback behavior against the staging snapshot.'},

      {id:'flags', name:'Retire rollout flags', group:'Release 2.4', state:'idle', attention:true, harness:'Codex', context:48, repo:'web-api', branch:'release/remove-flags', age:'29m', detail:'Three flags still have active cohorts. Should I preserve them through the release?'},
      {id:'notes', name:'Prepare support notes', group:'Release 2.4', state:'finished', harness:'Claude Code', context:26, repo:'support', branch:'release/2.4-notes', age:'46m', detail:'Support-facing behavior changes are documented.'},
      {id:'docs', name:'Refresh onboarding docs', group:'Website refresh', state:'finished', harness:'Claude Code', context:87, repo:'website', branch:'docs/onboarding', age:'1h', detail:'Onboarding rewrite is complete. Ready to review or resume.'},

      {id:'hero', name:'Polish homepage hero', group:'Website refresh', state:'idle', harness:'Codex', context:35, repo:'website', branch:'design/hero', age:'11m', detail:'No active turn. Ready for the next instruction.'},
      {id:'redirects', name:'Audit legacy redirects', group:'Website refresh', state:'working', harness:'Claude Code', context:49, repo:'website', branch:'seo/redirect-audit', age:'43m', detail:'Scanning production paths for redirect chains.'},
      {id:'invoices', name:'Reconcile duplicate invoices', group:'Billing incidents', state:'idle', attention:true, harness:'Codex', context:63, repo:'billing', branch:'incident/duplicate-invoices', age:'14m', detail:'I found two possible sources and need a production query approved.'},
      {id:'webhook', name:'Replay failed webhooks', group:'Billing incidents', state:'working', harness:'Claude Code', context:72, repo:'billing', branch:'incident/webhooks', age:'39m', detail:'Preparing a dry-run replay manifest.'},
      {id:'tax', name:'Check tax rounding drift', group:'Billing incidents', state:'idle', harness:'Codex', context:28, repo:'ledger', branch:'investigate/tax-rounding', age:'9m', detail:'No active turn. Ready for the next instruction.'},
      {id:'timeline', name:'Write incident timeline', group:'Billing incidents', state:'finished', harness:'Claude Code', context:91, repo:'ops', branch:'postmortem/billing', age:'2h', detail:'Timeline is complete and awaits review.'},
      {id:'search', name:'Prototype fuzzy search', group:'Sessionary MVP', state:'idle', harness:'Codex', context:23, repo:'sessionary', branch:'prototype/search', age:'4m', detail:'No active turn. Ready for the next instruction.'},
      {id:'tmux', name:'Spike tmux attachment', group:'Sessionary MVP', state:'idle', attention:true, harness:'Claude Code', context:59, repo:'sessionary', branch:'spike/tmux', age:'27m', detail:'Should detached sessions retain the original window title?'},
      {id:'states', name:'Model session states', group:'Sessionary MVP', state:'working', harness:'Codex', context:44, repo:'sessionary', branch:'model/session-state', age:'16m', detail:'Checking state transitions against the current UX notes.'},
      {id:'fixtures', name:'Expand fake session fixtures', group:'Sessionary MVP', state:'finished', harness:'Claude Code', context:31, repo:'sessionary', branch:'prototype/fixtures', age:'48m', detail:'Added high-density and mixed-state fixture sets.'},
      {id:'sdk', name:'Evaluate analytics SDK', group:'Analytics rollout', state:'idle', attention:true, harness:'Codex', context:67, repo:'web-app', branch:'spike/analytics-sdk', age:'21m', detail:'Do we prioritize bundle size or server-side feature coverage?'},
      {id:'events', name:'Define product events', group:'Analytics rollout', state:'idle', harness:'Claude Code', context:38, repo:'web-app', branch:'analytics/event-schema', age:'33m', detail:'No active turn. Ready for the next instruction.'},
      {id:'dashboard', name:'Validate KPI dashboard', group:'Analytics rollout', state:'finished', harness:'Codex', context:79, repo:'analytics', branch:'dashboard/kpi-review', age:'1h', detail:'The KPI dashboard matches the sample warehouse data.'},
      {id:'consent', name:'Review consent behavior', group:'Analytics rollout', state:'working', harness:'Claude Code', context:52, repo:'web-app', branch:'privacy/consent', age:'12m', detail:'Tracing events before and after consent changes.'},
      {id:'flake', name:'Triage checkout test flakes', group:'Maintenance', state:'idle', attention:true, harness:'Codex', context:33, repo:'web-app', branch:'test/checkout-flakes', age:'6m', detail:'Should I quarantine the three timing-sensitive cases first?'},
      {id:'deps', name:'Update terminal dependencies', group:'Maintenance', state:'idle', harness:'Claude Code', context:47, repo:'sessionary', branch:'chore/dependencies', age:'19m', detail:'No active turn. Ready for the next instruction.'},
      {id:'logs', name:'Reduce noisy API logs', group:'Maintenance', state:'working', harness:'Codex', context:61, repo:'web-api', branch:'chore/log-volume', age:'36m', detail:'Sampling repeated health-check and retry messages.'},
      {id:'secrets', name:'Rotate staging secrets', group:'Maintenance', state:'finished', harness:'Claude Code', context:18, repo:'ops', branch:'ops/secret-rotation', age:'3h', detail:'Rotation completed and old credentials revoked.'}
    ];
    let state = { selected:'auth', selectedGroup:null, movingGroup:null, previous:null, overlay:true, showHelp:true, toast:'', filter:'all', query:'', inHarness:false, drawerScroll:0 };
    let toastTimer;
    const variant = 'overview';
    const current = () => sessions.find(s => s.id === state.selected);
    const stateLabel = s => s.attention ? 'Needs input · Idle' : s.state[0].toUpperCase()+s.state.slice(1);
    const dotClass = s => s.attention ? 'input' : s.state;
    const sessionRow = s => `<button class="session ${s.id===state.selected?'selected':''}" data-session="${s.id}"><i class="dot ${dotClass(s)}"></i><span>${s.name}<div class="meta">${s.harness} · ${stateLabel(s)}</div></span><span class="context">${s.context}%</span></button>`;
    const previewRow = s => `<button class="session ${s.id===state.selected?'selected':''}" data-preview="${s.id}"><i class="dot ${dotClass(s)}"></i><span>${s.name}<div class="meta">${s.harness} · ${stateLabel(s)}</div></span><span class="context">${s.context}%</span></button>`;
    const groupTitle = group => group || 'Ungrouped';
    const terminal = (s=current()) => `<main class="terminal"><div class="term-head">${groupTitle(s.group)} / ${s.name} · ${s.harness} · context ${s.context}%</div><div class="agent"><span class="prompt">assistant ›</span> ${s.detail}\n\n<span class="prompt">you ›</span> <span class="cursor"></span></div></main>`;
    const boardOrder = [...new Set(sessions.map(s=>s.group).filter(Boolean)),''];
    const groups = () => boardOrder;
    const activeSessions = () => sessions.filter(s=>s.state!=='archived');
    const visibleSessions = () => state.filter==='archive' ? sessions.filter(s=>s.state==='archived') : state.filter==='input' ? activeSessions().filter(s=>s.attention) : activeSessions();
    const card = s => `<article class="card ${state.selectedGroup===null&&s.id===state.selected?'selected':''}" data-preview="${s.id}"><i class="dot ${dotClass(s)}" style="display:inline-block"></i> <strong>${s.name}</strong><div class="meta">${s.harness} · ${s.age}</div><p>${stateLabel(s)}</p><div class="meta">${s.repo} · ${s.branch}</div><div class="progress"><i style="width:${s.context}%"></i></div><span class="context">context ${s.context}%</span></article>`;
    function shell() {
      if (variant === 'overview') return `<div class="app">${terminal()}${state.overlay?overview():''}</div>${state.showHelp?`<div class="hint"><kbd>?</kbd> close help · <kbd>F2</kbd> overlay · <kbd>←↑↓→</kbd>/<kbd>h j k l</kbd> navigate · <kbd>Shift+arrows</kbd> move Session spatially · <kbd>Ctrl+↑/↓</kbd> order Group · <kbd>Enter</kbd> focus · <kbd>1</kbd> all · <kbd>2</kbd> needs input · <kbd>3</kbd> archive · <kbd>n</kbd> new Session · <kbd>g</kbd> new Group · <kbd>e</kbd> rename · <kbd>f</kbd> finish/resume · <kbd>a</kbd> archive · <kbd>r</kbd> restore</div>`:''}`;
      if (variant === 'workspace') return state.inHarness ? `<div class="app">${terminal()}</div><div class="hint"><kbd>Esc</kbd> return to Session workspace · <kbd>r</kbd> previous Session</div>` : workspace();
    }
    function overview() {
      const visible=visibleSessions(), archived=state.filter==='archive';
      const blocks=groups().map((g,groupIndex)=>{
        const items=visible.filter(s=>s.group===g); if(!items.length && state.filter!=='all') return '';
        const empty=!items.length;
        const content=empty ? '<p class="meta">No Sessions. Select this container and press n to create one here.</p>' : `<div class="grid">${items.map(card).join('')}</div>`;
        const head=empty ? `<button class="group-head empty-group ${state.selectedGroup===g?'selected-group':''}" data-empty-group-index="${groupIndex}"><strong>${groupTitle(g)}</strong><span>Empty</span></button>` : `<div class="group-head"><strong>${groupTitle(g)}</strong><span>${items.length} Session${items.length===1?'':'s'}</span></div>`;
        return `<section class="group-block ${state.movingGroup===g?'moving-group':''}" data-board-group-index="${groupIndex}">${head}${content}</section>`;
      }).join('');
      return `<div class="overlay"><section class="overview"><div class="overview-head"><h1>Showing ${visible.length} of ${sessions.length} Sessions across ${boardOrder.length-1} Groups + Ungrouped <span class="notice">· ${activeSessions().filter(s=>s.attention).length} need input</span></h1><div class="filters"><button class="chip ${state.filter==='all'?'active':''}" data-filter="all">1 All</button><button class="chip ${state.filter==='input'?'active':''}" data-filter="input">2 Needs input</button><button class="chip ${state.filter==='archive'?'active':''}" data-filter="archive">3 Archive</button></div></div><div class="board-track">${blocks||'<p class="meta">No Sessions in this view.</p>'}</div></section></div>`;
    }
    function workspace() { return ''; }
    function render() {
      document.getElementById('root').innerHTML = shell() + (state.toast?`<div class="toast">${state.toast}</div>`:'');
      document.querySelectorAll('[data-session]').forEach(el => el.onclick=()=>select(el.dataset.session));
      document.querySelectorAll('[data-preview]').forEach(el => el.onclick=()=>preview(el.dataset.preview));
      document.querySelectorAll('[data-empty-group-index]').forEach(el => el.onclick=()=>{ state.selectedGroup=groups()[Number(el.dataset.emptyGroupIndex)]; render(); });
      document.querySelectorAll('[data-filter]').forEach(el => el.onclick=()=>{ state.filter=el.dataset.filter; state.selectedGroup=null; const first=visibleSessions()[0]; if(first) state.selected=first.id; render(); });
      document.getElementById('focusSession')?.addEventListener('click', ()=>select(state.selected));
      document.getElementById('toggleFinished')?.addEventListener('click', toggleFinished);
      document.getElementById('sessionSearch')?.addEventListener('input', e=>{ state.query=e.target.value; render(); document.getElementById('sessionSearch')?.focus(); });
      const drawerList=document.getElementById('drawerList');
      if(drawerList) { drawerList.scrollTop=state.drawerScroll; drawerList.addEventListener('scroll',()=>{ state.drawerScroll=drawerList.scrollTop; }); }
      if(state.overlay) requestAnimationFrame(centerSelected);
      clearTimeout(toastTimer);
      if(state.toast) toastTimer=setTimeout(()=>{ state.toast=''; render(); },2500);
    }
    function select(id) { if(id!==state.selected) state.previous=state.selected; state.selected=id; state.overlay=false; state.inHarness=variant==='workspace'; state.toast=`Focused ${current().name}`; render(); }
    function preview(id) { state.selected=id; state.selectedGroup=null; render(); }
    function move(delta) { let i=sessions.findIndex(s=>s.id===state.selected); state.selected=sessions[(i+delta+sessions.length)%sessions.length].id; render(); document.querySelector('.drawer-list .session.selected')?.scrollIntoView({block:'nearest'}); }
    function jumpEdge(last=false) { state.selected=sessions[last?sessions.length-1:0].id; render(); scrollSelected(); }
    function jumpGroup(delta) { const names=groups(); let i=names.indexOf(current().group); const group=names[Math.max(0,Math.min(names.length-1,i+delta))]; state.selected=sessions.find(s=>s.group===group).id; render(); scrollSelected(); }
    function centerSelected() { document.querySelector('.overview .moving-group, .overview .selected-group, .overview .card.selected, .drawer-list .session.selected, .workspace tr.selected')?.scrollIntoView({block:'center',inline:'center'}); }
    function scrollSelected() { centerSelected(); }
    function moveOverview(direction) { const items=[...document.querySelectorAll('.overview .card, .overview .empty-group')]; const active=document.querySelector('.overview .card.selected, .overview .selected-group')||items[0]; if(!active) return; const a=active.getBoundingClientRect(), ax=a.left+a.width/2, ay=a.top+a.height/2; const candidates=items.filter(c=>c!==active).map(c=>{const r=c.getBoundingClientRect(),dx=r.left+r.width/2-ax,dy=r.top+r.height/2-ay;const primary=direction==='left'?-dx:direction==='right'?dx:direction==='up'?-dy:dy;const cross=['left','right'].includes(direction)?Math.abs(dy):Math.abs(dx);return {c,primary,cross};}).filter(x=>x.primary>2).sort((x,y)=>(x.primary*10+x.cross)-(y.primary*10+y.cross)); if(!candidates.length)return; const next=candidates[0].c; if(next.dataset.preview){state.selected=next.dataset.preview;state.selectedGroup=null;}else{state.selectedGroup=groups()[Number(next.dataset.emptyGroupIndex)];} render(); }
    function toggleFinished() { const s=current(); if(s.state==='finished'){s.state='idle';state.toast=`Resumed ${s.name} as Idle`;} else if(s.state!=='idle'){state.toast=`${s.name} is Working; wait for Idle before finishing`;} else {s.state='finished';s.attention=false;state.toast=`Finished ${s.name}`;} render(); }
    function createGroup() { const name=prompt('Group name:','New Group')?.trim(); if(!name||boardOrder.includes(name)) return; boardOrder.splice(boardOrder.length-1,0,name); state.selectedGroup=name; state.toast=`Created and selected Group ${name}`; render(); }
    function createSession() { const name=prompt('Session name (suggested, editable):','New Session')?.trim(); if(!name) return; const harnesses=['Claude Code','Codex']; const choice=prompt(`Choose Harness:\n${harnesses.map((harness,i)=>`${i+1}  ${harness}`).join('\n')}`,'2'); if(choice===null) return; const harness=harnesses[Number(choice)-1]; if(!harness) return; const group=state.selectedGroup!==null?state.selectedGroup:(current()?.group||''); sessions.push({id:`session-${Date.now()}`,name,group,state:'idle',harness,context:1,repo:'current repository',branch:'current branch',age:'now',detail:'New Session ready for its first instruction.'}); state.selected=sessions.at(-1).id; state.selectedGroup=null; state.filter='all'; state.toast=`Created ${name} in ${groupTitle(group)}`; render(); }
    function renameSession() { const s=current(),name=prompt('Session name:',s.name)?.trim(); if(name){s.name=name;state.toast=`Renamed to ${name}`;render();} }
    function moveSessionToGroup(delta) { const s=current(),i=boardOrder.indexOf(s.group||''),next=Math.max(0,Math.min(boardOrder.length-1,i+delta)); if(i===next)return; s.group=boardOrder[next]; state.toast=`Moved ${s.name} to ${groupTitle(s.group)}`; render(); }
    function moveSessionSpatially(direction) { const selected=document.querySelector('.overview .card.selected'); if(!selected)return; const cards=[...selected.parentElement.querySelectorAll('.card')],i=cards.indexOf(selected),columns=getComputedStyle(selected.parentElement).gridTemplateColumns.split(' ').filter(Boolean).length||4,row=Math.floor(i/columns),column=i%columns; let next=-1; if(direction==='left'&&column>0)next=i-1; if(direction==='right'&&column<columns-1&&i+1<cards.length)next=i+1; if(direction==='up'&&row>0)next=i-columns; if(direction==='down'&&i+columns<cards.length)next=i+columns; if(next>=0){const other=sessions.find(s=>s.id===cards[next].dataset.preview),a=sessions.indexOf(current()),b=sessions.indexOf(other);[sessions[a],sessions[b]]=[sessions[b],sessions[a]];state.toast=`Moved ${current().name} ${direction} within ${groupTitle(current().group)}`;render();return;} if(direction==='up'||direction==='down')moveSessionToGroup(direction==='down'?1:-1); }
    function reorderGroup(delta) { const group=state.selectedGroup!==null?state.selectedGroup:(current().group||''),i=boardOrder.indexOf(group),next=Math.max(0,Math.min(boardOrder.length-1,i+delta)); state.movingGroup=group; if(i===next){render();return;} boardOrder.splice(i,1); boardOrder.splice(next,0,group); state.toast=`${groupTitle(group)}: position ${next+1} on board`; render(); }
    function archiveSession() { const s=current(),before=visibleSessions(),index=before.indexOf(s); s.beforeArchive=s.state; s.beforeArchiveAttention=!!s.attention; s.state='archived'; s.attention=false; state.toast=`Archived ${s.name}`; const remaining=visibleSessions(),next=remaining[Math.min(index,remaining.length-1)]; if(next) state.selected=next.id; render(); }
    function restoreSession() { const s=current(); if(s.state!=='archived') return; s.state=s.beforeArchive||'finished'; s.attention=!!s.beforeArchiveAttention; state.filter='all'; state.toast=`Restored ${s.name} to ${stateLabel(s)}`; render(); }
    function advanceFakeHarnesses() { const session=sessions.find(s=>s.state==='working'&&!s.attention); if(!session) return; session.state='idle'; session.attention=true; session.detail='The current turn completed. This Session is ready for your input.'; state.toast=`${session.name}: Idle · Needs input`; render(); }
    addEventListener('keydown', e => {
      if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable) return;
      if(e.key==='r'&&!state.overlay&&state.previous) select(state.previous);
      if(e.key==='F2') { e.preventDefault(); state.overlay=!state.overlay; render(); return; }
      if(state.overlay && e.key==='?') { e.preventDefault(); state.showHelp=!state.showHelp; render(); return; }
      if(state.overlay && e.key==='Escape') { state.overlay=false; render(); }
      if(variant==='overview' && state.overlay && state.selectedGroup===null && e.shiftKey && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) { e.preventDefault(); moveSessionSpatially(e.key.replace('Arrow','').toLowerCase()); return; }
      if(variant==='overview' && state.overlay && e.ctrlKey && ['ArrowUp','ArrowDown'].includes(e.key)) { e.preventDefault(); reorderGroup(e.key==='ArrowDown'?1:-1); return; }
      if(variant==='overview' && state.overlay && !e.shiftKey && !e.ctrlKey && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) { e.preventDefault(); moveOverview(e.key.replace('Arrow','').toLowerCase()); }
      if(variant==='overview' && state.overlay && !e.shiftKey && !e.ctrlKey && ['h','j','k','l'].includes(e.key)) moveOverview({h:'left',l:'right',k:'up',j:'down'}[e.key]);
      if(variant==='overview' && state.overlay && e.key==='t') { state.filter=state.filter==='all'?'input':'all'; render(); }
      if(state.overlay && e.key==='1') { state.filter='all'; render(); }
      if(state.overlay && e.key==='2') { state.filter='input'; render(); }
      if(state.overlay && e.key==='3') { state.filter='archive'; const first=visibleSessions()[0]; if(first) state.selected=first.id; render(); }
      if(state.overlay && e.key==='n') createSession();
      if(state.overlay && e.key==='g') createGroup();
      if(state.overlay && state.selectedGroup===null && e.key==='e') renameSession();
      if(state.overlay && state.selectedGroup===null && e.key==='f' && state.filter!=='archive') toggleFinished();
      if(state.overlay && state.selectedGroup===null && e.key==='a' && state.filter!=='archive') archiveSession();
      if(state.overlay && state.selectedGroup===null && e.key==='r' && state.filter==='archive') restoreSession();
      if(variant==='workspace' && !state.inHarness && ['ArrowDown','ArrowUp','j','k'].includes(e.key) && !e.ctrlKey) { e.preventDefault(); move(['ArrowDown','j'].includes(e.key)?1:-1); scrollSelected(); }
      if(variant==='workspace' && !state.inHarness && e.ctrlKey && ['u','d'].includes(e.key)) { e.preventDefault(); document.querySelector('.workspace-list')?.scrollBy({top:e.key==='d'?innerHeight/2:-innerHeight/2,behavior:'smooth'}); }
      if(variant==='workspace' && !state.inHarness && ['[',']'].includes(e.key)) { e.preventDefault(); jumpGroup(e.key===']'?1:-1); }
      if(variant==='workspace' && !state.inHarness && ['g','G'].includes(e.key)) { e.preventDefault(); jumpEdge(e.key==='G'); }
      if(variant==='workspace' && state.inHarness && e.key==='Escape') { state.inHarness=false; state.toast=''; render(); }
      if(e.key==='Enter' && state.overlay && state.selectedGroup===null) select(state.selected);
      if(e.key==='Enter' && variant==='workspace' && !state.inHarness) select(state.selected);
    });
    addEventListener('keyup', e => { if(e.key==='Control'&&state.movingGroup!==null){state.movingGroup=null;render();} });
    render();
    setInterval(advanceFakeHarnesses,12000);
  </script>
</body>
</html>
