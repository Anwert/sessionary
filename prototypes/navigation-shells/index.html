<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sessionary navigation-shell prototype</title>
  <style>
    /* THROWAWAY PROTOTYPE: six shells, switchable with ?variant=sidebar|overview|drawer|status|panes|leader. */
    :root { color-scheme: dark; --bg:#0c1015; --panel:#141b23; --line:#293442; --muted:#8794a3; --text:#e8edf2; --accent:#75d5b2; --warn:#ffca68; --dim:#1b242e; }
    * { box-sizing: border-box; }
    body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace; }
    button { font:inherit; color:inherit; }
    .app { height:100vh; display:grid; }
    .terminal { min-width:0; background:#090d11; padding:22px 28px 72px; overflow:auto; }
    .term-head { color:var(--muted); margin-bottom:22px; }
    .prompt { color:var(--accent); }
    .agent { max-width:820px; white-space:pre-wrap; }
    .cursor { display:inline-block; width:8px; height:15px; background:var(--text); vertical-align:-2px; animation:blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .panel { background:var(--panel); border-color:var(--line); }
    .brand { padding:14px 16px; color:var(--accent); font-weight:700; border-bottom:1px solid var(--line); }
    .section-title { padding:15px 14px 7px; color:var(--muted); font-size:11px; letter-spacing:.09em; text-transform:uppercase; }
    .session { width:100%; border:0; border-left:3px solid transparent; background:transparent; text-align:left; padding:9px 12px; cursor:pointer; display:grid; grid-template-columns:12px 1fr auto; gap:8px; align-items:start; }
    .session:hover,.session.selected { background:var(--dim); border-left-color:var(--accent); }
    .dot { width:8px; height:8px; border-radius:50%; margin-top:4px; background:#6e7c8b; }
    .dot.input { background:var(--warn); box-shadow:0 0 8px #ffca6866; }
    .dot.working { background:var(--accent); }
    .dot.finished { background:#75879a; }
    .meta { color:var(--muted); font-size:11px; margin-top:2px; }
    .context { color:var(--muted); font-size:11px; }
    .notice { color:var(--warn); }
    .hint { position:fixed; top:10px; right:12px; color:var(--muted); background:#0c1015dd; border:1px solid var(--line); border-radius:5px; padding:6px 9px; z-index:20; }
    .switcher { position:fixed; z-index:50; bottom:14px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:12px; padding:7px 9px; border:1px solid #627185; border-radius:999px; background:#e9eef4; color:#10151b; box-shadow:0 8px 30px #000a; }
    .switcher button { width:30px; height:26px; border:0; border-radius:99px; background:#cbd5df; cursor:pointer; }
    .switcher span { min-width:240px; text-align:center; font-weight:700; }
    .overlay { position:fixed; inset:0 0 58px; z-index:15; background:#080c10f2; display:grid; place-items:center; }
    .overview { width:min(1050px,90vw); }
    .overview h1 { font-size:20px; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .card { padding:14px; border:1px solid var(--line); background:var(--panel); cursor:pointer; min-height:110px; }
    .card.selected { outline:2px solid var(--accent); }
    .drawer { position:fixed; z-index:14; top:0; right:0; bottom:58px; width:min(440px,48vw); border-left:1px solid var(--line); box-shadow:-20px 0 50px #0008; }
    .drawer .session { padding:14px; }
    .statusbar { position:fixed; z-index:12; left:0; right:0; bottom:58px; height:34px; display:flex; align-items:center; gap:18px; padding:0 14px; background:#17202a; border-top:1px solid var(--line); }
    .statusbar .attention { color:#111; background:var(--warn); padding:2px 7px; cursor:pointer; }
    .panes { grid-template-columns:1fr 1fr; gap:1px; background:var(--line); }
    .pane { background:#090d11; padding:18px; overflow:auto; }
    .pane.attention { box-shadow:inset 0 0 0 2px var(--warn); }
    .leader { position:fixed; z-index:18; inset:18% 23% auto; padding:16px; border:1px solid #69798d; box-shadow:0 18px 80px #000; }
    .leader h2 { margin:0 0 12px; font-size:15px; }
    .leader-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
    .leader-key { border:1px solid var(--line); background:var(--dim); padding:10px; text-align:left; cursor:pointer; }
    kbd { border:1px solid #657285; border-bottom-width:2px; border-radius:3px; padding:1px 5px; background:#202a35; }
    .toast { position:fixed; z-index:30; top:48px; left:50%; transform:translateX(-50%); padding:8px 12px; background:#332b19; color:var(--warn); border:1px solid #685a35; }
    @media (max-width:720px) { .grid { grid-template-columns:1fr; } .drawer { width:85vw; } .leader { inset:14% 5% auto; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const variants = [
      ['sidebar','A','Persistent sidebar'], ['overview','B','Fullscreen overview'],
      ['drawer','C','Transient drawer'], ['status','D','Status bar'],
      ['panes','E','Spatial panes'], ['leader','F','Leader navigation']
    ];
    const sessions = [
      {id:'auth', key:'a', name:'Fix OAuth callback', group:'Release 2.4', state:'working', harness:'Claude Code', context:68, detail:'Refactoring callback validation and running integration tests.'},
      {id:'billing', key:'b', name:'Investigate billing retry', group:'Release 2.4', state:'input', harness:'Codex', context:41, detail:'I need your choice: retry failed invoices immediately, or preserve the current nightly batch?'},
      {id:'docs', key:'d', name:'Refresh onboarding docs', group:'Website', state:'finished', harness:'Claude Code', context:87, detail:'Onboarding rewrite is complete. Ready to review or resume.'},
      {id:'search', key:'s', name:'Prototype fuzzy search', group:'Ungrouped', state:'working', harness:'Codex', context:23, detail:'Comparing scoring behavior on short session names.'},
      {id:'perf', key:'p', name:'Trace startup regression', group:'Website', state:'input', harness:'Claude Code', context:76, detail:'Which baseline should I use: last release or the pre-router commit?'}
    ];
    let state = { selected:'auth', previous:null, overlay:false, toast:'', leader:false };
    const params = new URLSearchParams(location.search);
    let variant = variants.some(v => v[0] === params.get('variant')) ? params.get('variant') : 'sidebar';
    const current = () => sessions.find(s => s.id === state.selected);
    const stateLabel = s => s.state === 'input' ? 'Needs input' : s.state[0].toUpperCase()+s.state.slice(1);
    const sessionRow = s => `<button class="session ${s.id===state.selected?'selected':''}" data-session="${s.id}"><i class="dot ${s.state}"></i><span>${s.name}<div class="meta">${s.harness} · ${stateLabel(s)}</div></span><span class="context">${s.context}%</span></button>`;
    const terminal = (s=current()) => `<main class="terminal"><div class="term-head">${s.group} / ${s.name} · ${s.harness} · context ${s.context}%</div><div class="agent"><span class="prompt">assistant ›</span> ${s.detail}\n\n<span class="prompt">you ›</span> <span class="cursor"></span></div></main>`;
    const grouped = () => ['Release 2.4','Website','Ungrouped'].map(g => `<div class="section-title">${g}</div>${sessions.filter(s=>s.group===g).map(sessionRow).join('')}`).join('');
    function shell() {
      if (variant === 'sidebar') return `<div class="app" style="grid-template-columns:300px 1fr"><aside class="panel"><div class="brand">SESSIONARY <span class="notice">· 2</span></div>${grouped()}</aside>${terminal()}</div><div class="hint"><kbd>j/k</kbd> move · <kbd>Enter</kbd> focus · <kbd>r</kbd> return</div>`;
      if (variant === 'overview') return `<div class="app">${terminal()}${state.overlay?overview():''}</div><div class="hint"><kbd>Space</kbd> overview · arrows move · <kbd>Enter</kbd> focus · <kbd>r</kbd> return</div>`;
      if (variant === 'drawer') return `<div class="app">${terminal()}${state.overlay?`<aside class="drawer panel"><div class="brand">SESSIONS <span class="notice">· 2 need input</span></div>${grouped()}</aside>`:''}</div><div class="hint"><kbd>Ctrl+k</kbd> drawer · <kbd>j/k</kbd> move · <kbd>Enter</kbd> focus · <kbd>r</kbd> return</div>`;
      if (variant === 'status') return `<div class="app">${terminal()}<div class="statusbar"><strong>Sessionary</strong><span>${sessions.filter(s=>s.state==='working').length} working</span><button class="attention" id="nextInput">2 need input · jump ↵</button><span>context ${current().context}%</span><span style="margin-left:auto">${current().name}</span></div></div><div class="hint"><kbd>Alt+n</kbd> next input · <kbd>r</kbd> return</div>`;
      if (variant === 'panes') return `<div class="app panes"><section class="pane"><div class="term-head">1 · ${current().name} · ${current().context}%</div>${terminal(current()).replace(/<main[^>]*>|<\/main>/g,'')}</section><section class="pane attention"><div class="term-head notice">2 · ${sessions[1].name} · Needs input · ${sessions[1].context}%</div>${terminal(sessions[1]).replace(/<main[^>]*>|<\/main>/g,'')}</section></div><div class="hint"><kbd>Ctrl+w</kbd> then arrow · <kbd>r</kbd> return</div>`;
      return `<div class="app">${terminal()}${state.leader?leader():''}</div><div class="hint"><kbd>Ctrl+Space</kbd> leader · then session key · <kbd>r</kbd> return</div>`;
    }
    function overview() { return `<div class="overlay"><section class="overview"><h1>All sessions <span class="notice">· 2 need input</span></h1><div class="grid">${sessions.map(s=>`<article class="card ${s.id===state.selected?'selected':''}" data-session="${s.id}"><i class="dot ${s.state}" style="display:inline-block"></i> <strong>${s.name}</strong><div class="meta">${s.group} · ${s.harness}</div><p>${stateLabel(s)}</p><span class="context">context ${s.context}%</span></article>`).join('')}</div></section></div>`; }
    function leader() { return `<section class="leader panel"><h2>Sessionary leader</h2><div class="leader-grid">${sessions.map(s=>`<button class="leader-key" data-session="${s.id}"><kbd>${s.key}</kbd> ${s.name}<div class="meta">${stateLabel(s)} · ${s.context}%</div></button>`).join('')}</div></section>`; }
    function switcher() { const i=variants.findIndex(v=>v[0]===variant), v=variants[i]; return `<nav class="switcher"><button id="prev" aria-label="Previous variant">←</button><span>${v[1]} · ${v[2]} (${i+1}/6)</span><button id="next" aria-label="Next variant">→</button></nav>`; }
    function render() {
      document.getElementById('root').innerHTML = shell() + (state.toast?`<div class="toast">${state.toast}</div>`:'') + switcher();
      document.querySelectorAll('[data-session]').forEach(el => el.onclick=()=>select(el.dataset.session));
      document.getElementById('prev').onclick=()=>cycle(-1); document.getElementById('next').onclick=()=>cycle(1);
      document.getElementById('nextInput')?.addEventListener('click', nextInput);
    }
    function select(id) { if(id!==state.selected) state.previous=state.selected; state.selected=id; state.overlay=false; state.leader=false; state.toast=`Focused ${current().name}`; render(); }
    function move(delta) { let i=sessions.findIndex(s=>s.id===state.selected); state.selected=sessions[(i+delta+sessions.length)%sessions.length].id; render(); }
    function cycle(delta) { let i=variants.findIndex(v=>v[0]===variant); variant=variants[(i+delta+variants.length)%variants.length][0]; const u=new URL(location); u.searchParams.set('variant',variant); history.replaceState({},'',u); state.overlay=false; state.leader=false; state.toast=''; render(); }
    function nextInput() { const needs=sessions.filter(s=>s.state==='input'); let i=needs.findIndex(s=>s.id===state.selected); select(needs[(i+1+needs.length)%needs.length].id); }
    addEventListener('keydown', e => {
      if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable) return;
      if(e.key==='ArrowLeft') cycle(-1); if(e.key==='ArrowRight') cycle(1);
      if(e.key==='r'&&state.previous) select(state.previous);
      if(variant==='sidebar' && ['j','k'].includes(e.key)) move(e.key==='j'?1:-1);
      if(variant==='overview' && e.code==='Space') { e.preventDefault(); state.overlay=!state.overlay; render(); }
      if(variant==='overview' && state.overlay && ['j','k'].includes(e.key)) move(e.key==='j'?1:-1);
      if(variant==='drawer' && e.ctrlKey && e.key==='k') { e.preventDefault(); state.overlay=!state.overlay; render(); }
      if(variant==='drawer' && state.overlay && ['j','k'].includes(e.key)) move(e.key==='j'?1:-1);
      if(variant==='status' && e.altKey && e.key==='n') { e.preventDefault(); nextInput(); }
      if(variant==='leader' && e.ctrlKey && e.code==='Space') { e.preventDefault(); state.leader=!state.leader; render(); }
      if(variant==='leader' && state.leader) { const s=sessions.find(s=>s.key===e.key); if(s) select(s.id); }
      if(e.key==='Enter' && (state.overlay||state.leader)) select(state.selected);
    });
    render();
  </script>
</body>
</html>
