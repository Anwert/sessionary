<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sessionary workflow prototype</title>
  <style>
    /* THROWAWAY PROTOTYPE: one keyboard-only Session workflow, backed by an in-memory reducer. */
    :root { color-scheme:dark; --bg:#090d12; --panel:#121923; --line:#293544; --muted:#8795a7; --text:#edf2f7; --accent:#79d9b5; --warn:#ffca68; --danger:#ff7b82; --blue:#82b7ff; }
    * { box-sizing:border-box } body { margin:0; height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace } button,input,select { font:inherit; color:inherit }
    .terminal { height:100vh; padding:24px 30px; color:#c5ced8; background:#070a0e }.prompt { color:var(--accent) }.cursor { display:inline-block; width:8px; height:15px; vertical-align:-2px; background:white }
    .overlay { position:fixed; inset:18px 22px 68px; display:flex; flex-direction:column; background:#0c1118f8; border:1px solid #364457; box-shadow:0 28px 100px #000c }
    header { display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid var(--line) } h1 { margin:0; font-size:18px } .summary { margin-left:auto; color:var(--muted) }
    kbd { padding:1px 5px; border:1px solid #66758a; border-bottom-width:2px; border-radius:4px; background:#202b37 }.accent { color:var(--accent) }.warn { color:var(--warn) }
    .toolbar { display:flex; gap:8px; padding:10px 18px; border-bottom:1px solid var(--line); color:var(--muted) }.toolbar span { padding:4px 8px; border:1px solid var(--line) }.toolbar .active { color:#07110e; background:var(--accent) }
    .board { flex:1; min-height:0; overflow:auto; padding:16px 18px 80px }.group { margin-bottom:22px }.group-title { position:sticky; top:-16px; z-index:2; display:flex; gap:10px; padding:10px 2px 7px; background:#0c1118; color:var(--text) }.group-title small { color:var(--muted) }
    .sections { display:grid; grid-template-columns:repeat(3,minmax(250px,1fr)); gap:10px }.section { min-height:116px; padding:9px; border:1px solid var(--line); background:#0f1620 }.section-head { display:flex; justify-content:space-between; margin-bottom:8px; color:var(--muted); font-size:11px; letter-spacing:.08em; text-transform:uppercase }
    .card { display:block; width:100%; margin:0 0 7px; padding:10px; text-align:left; border:1px solid #303d4d; background:var(--panel); cursor:pointer }.card.selected { border-color:var(--accent); outline:1px solid var(--accent) }.card strong { display:block }.meta { margin-top:4px; color:var(--muted); font-size:11px }.bar { height:4px; margin-top:8px; background:#293442 }.bar i { display:block; height:100%; background:var(--accent) }.dot { display:inline-block; width:7px; height:7px; margin-right:6px; border-radius:50%; background:var(--accent) }.needs-input .dot { background:var(--warn); box-shadow:0 0 7px #ffca6877 }.finished .dot { background:#738296 }
    .inspector { position:absolute; right:14px; bottom:14px; width:min(520px,46vw); padding:12px 14px; border:1px solid #415064; background:#101720f5; box-shadow:0 12px 45px #000a }.inspector strong { color:var(--accent) }.inspector .keys { margin-top:8px; color:var(--muted) }
    .empty { color:#536174; font-style:italic }.archive { display:grid; grid-template-columns:repeat(3,1fr); gap:10px }
    .dialog { position:fixed; z-index:20; inset:0; display:grid; place-items:center; background:#030609b8 }.dialog-box { width:min(620px,90vw); padding:20px; border:1px solid #586b82; background:#121a24; box-shadow:0 20px 80px #000 }.dialog h2 { margin:0 0 8px }.dialog p { color:var(--muted) }.dialog label { display:block; margin:12px 0 5px; color:var(--muted) }.dialog input,.dialog select { width:100%; padding:9px 10px; border:1px solid #405065; background:#0b1118 }.dialog .buttons { display:flex; justify-content:flex-end; gap:8px; margin-top:18px }.dialog button { padding:7px 10px; border:1px solid var(--line); background:#1a2531 }.dialog button.primary { color:#07110e; background:var(--accent) }
    .guide { position:fixed; z-index:30; left:50%; bottom:12px; transform:translateX(-50%); display:flex; align-items:center; gap:10px; width:min(960px,92vw); padding:8px 12px; border:1px solid #66758a; border-radius:8px; background:#e9eef4; color:#121820; box-shadow:0 8px 35px #000b }.guide button { border:0; border-radius:4px; padding:5px 8px; background:#c8d3de; color:#121820; cursor:pointer }.guide .scenario { font-weight:700 }.guide .step { flex:1; text-align:center }.toast { position:fixed; z-index:25; top:34px; left:50%; transform:translateX(-50%); padding:8px 12px; border:1px solid #6a5932; background:#342b18; color:var(--warn) }
    @media(max-width:900px){.sections{grid-template-columns:1fr}.inspector{width:calc(100% - 28px)}.archive{grid-template-columns:1fr}}
  </style>
</head>
<body><div id="root"></div>
<script>
  // Question: can one keyboard-only, state-sectioned overlay make Session creation,
  // movement, attention, completion, archiving, and restoration feel like one workflow?
  const initialState = {
    overlay:true, view:'active', selected:'retry', previous:'oauth', toast:'', dialog:null,
    groups:[{id:'release',name:'Release 2.4'},{id:'sessionary',name:'Sessionary MVP'},{id:'ungrouped',name:'Ungrouped'}],
    sessions:[
      {id:'oauth',name:'Fix OAuth callback',group:'release',state:'working',harness:'Claude Code',context:68,repo:'web-api',branch:'fix/oauth-callback',detail:'Refactoring callback validation and running integration tests.'},
      {id:'retry',name:'Investigate billing retry',group:'release',state:'needs-input',harness:'Codex',context:41,repo:'billing',branch:'investigate/retries',detail:'Choose immediate retry or preserve the nightly batch.'},
      {id:'notes',name:'Prepare support notes',group:'release',state:'finished',harness:'Claude Code',context:26,repo:'support',branch:'release/2.4-notes',detail:'Support-facing behavior changes are documented.'},
      {id:'tmux',name:'Spike tmux attachment',group:'sessionary',state:'needs-input',harness:'Claude Code',context:59,repo:'sessionary',branch:'spike/tmux',detail:'Should detached Sessions retain the original window title?'},
      {id:'states',name:'Model Session states',group:'sessionary',state:'working',harness:'Codex',context:44,repo:'sessionary',branch:'model/session-state',detail:'Checking state transitions against the current UX notes.'},
      {id:'fixtures',name:'Expand fake Session fixtures',group:'sessionary',state:'finished',harness:'Claude Code',context:31,repo:'sessionary',branch:'prototype/fixtures',detail:'High-density and mixed-state fixtures are ready.'},
      {id:'scratch',name:'Explore fuzzy matching',group:'ungrouped',state:'working',harness:'Codex',context:18,repo:'sessionary',branch:'spike/search',detail:'Comparing scoring on short Session names.'},
      {id:'old',name:'Audit legacy redirects',group:'release',state:'archived',harness:'Claude Code',context:87,repo:'website',branch:'seo/redirects',detail:'Archived after the audit was superseded.'}
    ]
  };
  let state=structuredClone(initialState);
  const sections=[['needs-input','Needs input'],['working','Working'],['finished','Finished']];
  const current=()=>state.sessions.find(s=>s.id===state.selected);
  const active=()=>state.sessions.filter(s=>s.state!=='archived');
  const visible=()=>state.view==='archive'?state.sessions.filter(s=>s.state==='archived'):active();
  const label=s=>s.state==='needs-input'?'Needs input':s.state[0].toUpperCase()+s.state.slice(1);
  function reducer(s,a){
    const n=structuredClone(s), item=n.sessions.find(x=>x.id===a.id||x.id===n.selected);
    if(a.type==='select') n.selected=a.id;
    if(a.type==='finish'&&item) item.state=item.state==='finished'?'working':'finished';
    if(a.type==='archive'&&item){item.beforeArchive=item.state;item.state='archived';n.selected=activeFrom(n)[0]?.id||'';}
    if(a.type==='restore'&&item){item.state=item.beforeArchive||'finished';n.view='active';n.selected=item.id;}
    if(a.type==='move'&&item) item.group=a.group;
    if(a.type==='rename'&&item) item.name=a.name;
    if(a.type==='group') n.groups.splice(n.groups.length-1,0,{id:a.id,name:a.name});
    if(a.type==='session'){n.sessions.push(a.session);n.selected=a.session.id;}
    return n;
  }
  const activeFrom=s=>s.sessions.filter(x=>x.state!=='archived');
  function dispatch(a,msg=''){state=reducer(state,a);state.toast=msg;render();}
  function card(s){return `<button class="card ${s.state} ${s.id===state.selected?'selected':''}" data-select="${s.id}"><span class="dot"></span><strong>${s.name}</strong><div class="meta">${s.harness} · ${s.repo}<br>${s.branch}</div><div class="bar"><i style="width:${s.context}%"></i></div><div class="meta">context ${s.context}%</div></button>`}
  function terminal(){const s=current()||state.sessions[0];return `<main class="terminal"><div>${s.group} / ${s.name} · ${s.harness} · context ${s.context}%</div><p><span class="prompt">assistant ›</span> ${s.detail}</p><p><span class="prompt">you ›</span> <span class="cursor"></span></p></main>`}
  function activeBoard(){return state.groups.map(g=>{const members=active().filter(s=>s.group===g.id);if(!members.length)return'';return `<section class="group"><div class="group-title"><strong>${g.name}</strong><small>${members.length} Session${members.length===1?'':'s'}</small></div><div class="sections">${sections.map(([key,name])=>{const items=members.filter(s=>s.state===key);return `<section class="section"><div class="section-head"><span>${name}</span><span>${items.length}</span></div>${items.map(card).join('')||'<div class="empty">No Sessions</div>'}</section>`}).join('')}</div></section>`}).join('')}
  function archiveBoard(){const items=visible();return `<section class="group"><div class="group-title"><strong>Archive</strong><small>${items.length} Sessions · press r to restore</small></div><div class="archive">${items.map(card).join('')||'<div class="empty">Nothing archived</div>'}</div></section>`}
  function overlay(){const s=current();return `<section class="overlay"><header><h1>Sessionary</h1><span class="accent">${state.view==='active'?'Session board':'Archive'}</span><span class="summary"><span class="warn">${active().filter(x=>x.state==='needs-input').length} need input</span> · ${active().length} active · ${state.groups.length-1} Groups</span></header><div class="toolbar"><span class="${state.view==='active'?'active':''}">1 Active</span><span class="${state.view==='archive'?'active':''}">2 Archive</span><span><kbd>n</kbd> new Session</span><span><kbd>g</kbd> new Group</span><span><kbd>m</kbd> move</span></div><main class="board">${state.view==='active'?activeBoard():archiveBoard()}</main>${s?`<aside class="inspector"><strong>${s.name}</strong> · ${label(s)}<div class="meta">${s.harness} · ${s.repo} · ${s.branch}<br>${s.detail}</div><div class="keys">${state.view==='archive'?'<kbd>r</kbd> restore':'<kbd>Enter</kbd> focus · <kbd>e</kbd> rename · <kbd>f</kbd> finish/resume · <kbd>a</kbd> archive'}</div></aside>`:''}</section>`}
  const dialogTitle={session:'Create Session',group:'Create Group',move:'Move Session',rename:'Rename Session'};
  function dialog(){if(!state.dialog)return'';const d=state.dialog,s=current();let fields='';if(d==='session')fields=`<label>Harness</label><select id="harness"><option>Claude Code</option><option>Codex</option></select><label>Session name (suggested, editable)</label><input id="name" value="Investigate new task"><label>Group</label><select id="group"><option value="ungrouped">Ungrouped</option>${state.groups.filter(g=>g.id!=='ungrouped').map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}</select>`;if(d==='group')fields='<label>Group name</label><input id="name" value="New Group">';if(d==='move')fields=`<p>Move <strong>${s.name}</strong> to:</p><select id="group">${state.groups.map(g=>`<option value="${g.id}" ${g.id===s.group?'selected':''}>${g.name}</option>`).join('')}</select>`;if(d==='rename')fields=`<label>Session name</label><input id="name" value="${s.name}">`;return `<div class="dialog"><form class="dialog-box" id="dialogForm"><h2>${dialogTitle[d]}</h2>${fields}<div class="buttons"><button type="button" id="cancel">Esc Cancel</button><button class="primary">Enter Confirm</button></div></form></div>`}
  const scenarios=[
    {name:'Attention → focus',steps:['Select “Investigate billing retry”','Press Enter to focus it','Press Ctrl+G to reopen the board']},
    {name:'Finish → archive → restore',steps:['Select any Working Session','Press f to move it to Finished','Press a to archive it','Press 2, then r to restore it']},
    {name:'Create → organize',steps:['Press g to create a Group','Press n to create a Session','Press m to move the selected Session']}
  ];let scenario=0,step=0;
  function guide(){const sc=scenarios[scenario];return `<nav class="guide"><button id="prevScenario">←</button><span class="scenario">${scenario+1}/${scenarios.length} ${sc.name}</span><span class="step">Step ${step+1}/${sc.steps.length}: ${sc.steps[step]}</span><button id="doneStep">Done →</button><button id="nextScenario">→</button><button id="reset">Reset</button></nav>`}
  function render(){document.getElementById('root').innerHTML=terminal()+(state.overlay?overlay():'')+dialog()+(state.toast?`<div class="toast">${state.toast}</div>`:'')+guide();document.querySelectorAll('[data-select]').forEach(el=>el.onclick=()=>dispatch({type:'select',id:el.dataset.select}));document.getElementById('cancel')?.addEventListener('click',closeDialog);document.getElementById('dialogForm')?.addEventListener('submit',submitDialog);document.getElementById('prevScenario').onclick=()=>changeScenario(-1);document.getElementById('nextScenario').onclick=()=>changeScenario(1);document.getElementById('doneStep').onclick=()=>{step=(step+1)%scenarios[scenario].steps.length;render()};document.getElementById('reset').onclick=()=>{state=structuredClone(initialState);step=0;render()};requestAnimationFrame(()=>document.querySelector('.card.selected')?.scrollIntoView({block:'nearest'}));}
  function openDialog(type){state.dialog=type;state.toast='';render();requestAnimationFrame(()=>document.querySelector('.dialog input, .dialog select')?.focus())}
  function closeDialog(){state.dialog=null;render()}
  function submitDialog(e){e.preventDefault();const d=state.dialog,name=document.getElementById('name')?.value.trim(),group=document.getElementById('group')?.value;if(d==='group'&&name){const id='g'+Date.now();dispatch({type:'group',id,name},`Created Group “${name}”`)}if(d==='session'&&name){const id='s'+Date.now(),harness=document.getElementById('harness').value;dispatch({type:'session',session:{id,name,group,state:'working',harness,context:2,repo:'current directory',branch:'current branch',detail:'New Session, ready for its first instruction.'}},`Created ${harness} Session “${name}”`)}if(d==='move')dispatch({type:'move',group},`Moved Session to ${state.groups.find(g=>g.id===group).name}`);if(d==='rename'&&name)dispatch({type:'rename',name},`Renamed Session to “${name}”`);state.dialog=null;render()}
  function ordered(){return visible()}
  function moveSelection(delta){const list=ordered(),i=Math.max(0,list.findIndex(s=>s.id===state.selected));if(list.length)dispatch({type:'select',id:list[(i+delta+list.length)%list.length].id})}
  function changeScenario(delta){scenario=(scenario+delta+scenarios.length)%scenarios.length;step=0;render()}
  addEventListener('keydown',e=>{if(state.dialog){if(e.key==='Escape'){e.preventDefault();closeDialog()}return}if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.ctrlKey&&e.key.toLowerCase()==='g'){e.preventDefault();state.overlay=!state.overlay;state.toast='';render();return}if(!state.overlay)return;if(['ArrowRight','ArrowDown','l','j'].includes(e.key)){e.preventDefault();moveSelection(1)}if(['ArrowLeft','ArrowUp','h','k'].includes(e.key)){e.preventDefault();moveSelection(-1)}if(e.key==='1'){state.view='active';state.selected=active()[0]?.id||'';render()}if(e.key==='2'){state.view='archive';state.selected=visible()[0]?.id||'';render()}if(e.key==='n'&&state.view==='active')openDialog('session');if(e.key==='g'&&state.view==='active')openDialog('group');if(e.key==='m'&&state.view==='active')openDialog('move');if(e.key==='e'&&state.view==='active')openDialog('rename');if(e.key==='f'&&state.view==='active')dispatch({type:'finish'},`${current().name}: ${current().state==='finished'?'resumed':'finished'}`);if(e.key==='a'&&state.view==='active')dispatch({type:'archive'},'Session archived; press 2 to view Archive');if(e.key==='r'&&state.view==='archive')dispatch({type:'restore'},'Session restored to its previous Section');if(e.key==='Enter'&&state.view==='active'){state.previous=state.selected;state.overlay=false;state.toast=`Focused ${current().name}`;render()}if(e.key==='Escape'){state.overlay=false;render()}});
  render();
</script></body></html>
